info:
  name: Atualizar artigo existente
  type: http
  seq: 8
  tags:
    - Artigo

http:
  method: PUT
  url: "{{baseUrl}}/api/artigos/:id"
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "titulo": "Produção de Radiofármacos para Diagnóstico e Tratamento Oncológico (Revisado)",
        "resumo": "Visão geral sobre o papel dos reatores de pesquisa na geração de radioisótopos essenciais para a medicina moderna.",
        "aplicacaoReal": "Uso do radioisótopo Tecnécio-99m (Tc-99m) produzido pelo IPEN/CNEN em procedimentos de cintilografia para mapeamento de órgãos vitais.",
        "impactoSociedade": "Possibilita diagnósticos precoces de tumores e doenças cardíacas no SUS, beneficiando milhões de pacientes anualmente com tratamentos não invasivos.",
        "area": "SAUDE",
        "localId": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Artigo atualizado com sucesso
    request:
      url: "{{baseUrl}}/api/artigos/:id"
      method: PUT
      params:
        - name: id
          value: "1"
          type: path
      body:
        type: json
        data: |-
          {
            "titulo": "Produção de Radiofármacos para Diagnóstico e Tratamento Oncológico (Revisado)",
            "resumo": "Visão geral sobre o papel dos reatores de pesquisa na geração de radioisótopos essenciais para a medicina moderna.",
            "aplicacaoReal": "Uso do radioisótopo Tecnécio-99m (Tc-99m) produzido pelo IPEN/CNEN em procedimentos de cintilografia para mapeamento de órgãos vitais.",
            "impactoSociedade": "Possibilita diagnósticos precoces de tumores e doenças cardíacas no SUS, beneficiando milhões de pacientes anualmente com tratamentos não invasivos.",
            "area": "SAUDE",
            "localId": 1
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "id": 1,
            "areaAplicacao": "SAUDE",
            "titulo": "Produção de Radiofármacos para Diagnóstico e Tratamento Oncológico (Revisado)",
            "resumo": "Visão geral sobre o papel dos reatores de pesquisa na geração de radioisótopos essenciais para a medicina moderna.",
            "aplicacaoReal": "Uso do radioisótopo Tecnécio-99m (Tc-99m) produzido pelo IPEN/CNEN em procedimentos de cintilografia para mapeamento de órgãos vitais.",
            "impactoSociedade": "Possibilita diagnósticos precoces de tumores e doenças cardíacas no SUS, beneficiando milhões de pacientes anualmente com tratamentos não invasivos.",
            "nomeLocal": "Complexo radiológico de Iperó/Aramar (CTMSP)",
            "paisLocal": "Brazil",
            "status": "RASCUNHO",
            "referencias": [
              "https://www.marinha.mil.br/ctmsp/programa-nuclear"
            ],
            "atualizadoEm": "2026-10-26T22:00:00.000Z"
          }
  - name: 404 Response
    description: Artigo não encontrado para o ID informado
    request:
      url: "{{baseUrl}}/api/artigos/:id"
      method: PUT
      params:
        - name: id
          value: "999"
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "mensagem": "Artigo de id (999) não encontrado!",
            "erro": "Not Found",
            "status": 404,
            "timestamp": "2026-10-26T22:00:00"
          }

docs: Atualiza os campos informados de um artigo existente e renova o carimbo de data da última modificação.
