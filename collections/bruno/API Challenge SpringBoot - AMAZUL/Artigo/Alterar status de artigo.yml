info:
  name: Alterar status de artigo
  type: http
  seq: 9
  tags:
    - Artigo

http:
  method: PUT
  url: "{{baseUrl}}/api/artigos/alterarStatus/:id"
  params:
    - name: id
      value: "1"
      type: path
    - name: status
      value: PUBLICADO
      type: query
    - name: status
      value: RASCUNHO
      type: query
      disabled: true
    - name: status
      value: ARQUIVADO
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Status de artigo atualizado com sucesso
    request:
      url: "{{baseUrl}}/api/artigos/alterarStatus/:id?status=PUBLICADO"
      method: PUT
      params:
        - name: id
          value: "1"
          type: path
        - name: status
          value: PUBLICADO
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "id": 1,
            "areaAplicacao": "SAUDE",
            "titulo": "Produção de Radiofármacos para Diagnóstico e Tratamento Oncológico",
            "resumo": "Visão geral sobre o papel dos reatores de pesquisa na geração de radioisótopos essenciais para a medicina moderna.",
            "aplicacaoReal": "Uso do radioisótopo Tecnécio-99m (Tc-99m) produzido pelo IPEN/CNEN em procedimentos de cintilografia para mapeamento de órgãos vitais.",
            "impactoSociedade": "Possibilita diagnósticos precoces de tumores e doenças cardíacas no SUS, beneficiando milhões de pacientes anualmente com tratamentos não invasivos.",
            "nomeLocal": "Complexo radiológico de Iperó/Aramar (CTMSP)",
            "paisLocal": "Brazil",
            "status": "PUBLICADO",
            "referencias": [
              "https://www.marinha.mil.br/ctmsp/programa-nuclear"
            ],
            "atualizadoEm": "2026-10-26T22:00:00.000Z"
          }
  - name: 422 Response
    description: Transição inválida de status do artigo
    request:
      url: "{{baseUrl}}/api/artigos/alterarStatus/:id?status=RASCUNHO"
      method: PUT
      params:
        - name: id
          value: "1"
          type: path
        - name: status
          value: RASCUNHO
          type: query
    response:
      status: 422
      statusText: Unprocessable Content
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "mensagem": "Esse artigo não pode ser alterado para: RASCUNHO",
            "erro": "Unprocessable Content",
            "status": 422,
            "timestamp": "2026-10-26T22:00:00"
          }

docs: Altera o ciclo de vida do artigo (RASCUNHO -> PUBLICADO -> ARQUIVADO). Dispara HTTP 422 caso a transição solicitada seja ilegal.
