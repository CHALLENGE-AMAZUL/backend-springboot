info:
  name: Lista todos os artigos com paginação
  type: http
  seq: 1
  tags:
    - Artigo

http:
  method: GET
  url: "{{baseUrl}}/api/artigos"
  params:
    - name: pagina
      value: "0"
      type: query
    - name: tamanho
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Página de artigos retornada com sucesso
    request:
      url: "{{baseUrl}}/api/artigos"
      method: GET
      params:
        - name: pagina
          value: "0"
          type: query
        - name: tamanho
          value: "10"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "conteudo": [
              {
                "id": 1,
                "areaAplicacao": "SAUDE",
                "titulo": "Produção de Radiofármacos para Diagnóstico e Tratamento Oncológico",
                "resumo": "Visão geral sobre o papel dos reatores de pesquisa na geração de radioisótopos essenciais para a medicina moderna.",
                "aplicacaoReal": "Uso do radioisótopo Tecnécio-99m (Tc-99m) produzido pelo IPEN/CNEN em procedimentos de cintilografia para mapeamento de órgãos vitais.",
                "impactoSociedade": "Possibilita diagnósticos precoces de tumores e doenças cardíacas no SUS, beneficiando milhões de pacientes anualmente com tratamentos não invasivos.",
                "nomeLocal": "Complexo radiológico de Iperó/Aramar (CTMSP)",
                "paisLocal": "Brazil",
                "status": "RASCUNHO",
                "referencias": [
                  "https://www.marinha.mil.br/ctmsp/programa-nuclear"
                ],
                "atualizadoEm": "2026-10-26T22:00:00.000Z"
              }
            ],
            "pagina": 0,
            "tamanho": 10,
            "totalElementos": 1,
            "totalPaginas": 1,
            "ultimo": true
          }
  - name: 400 Response
    description: Parâmetros de paginação inválidos
    request:
      url: "{{baseUrl}}/api/artigos"
      method: GET
      params:
        - name: pagina
          value: "abc"
          type: query
        - name: tamanho
          value: "10"
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "mensagem": "Parâmetro: (pagina) inválido!",
            "erro": "Bad Request",
            "status": 400,
            "timestamp": "2026-10-26T22:00:00"
          }
  - name: 500 Response
    description: Erro interno no servidor
    request:
      url: "{{baseUrl}}/api/artigos"
      method: GET
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "mensagem": "Erro interno inesperado.",
            "erro": "Internal Server Error",
            "status": 500,
            "timestamp": "2026-10-26T22:00:00"
          }

docs: Recupera uma página de artigos cadastrados no acervo educativo da AMAZUL, incluindo dados do local e referências bibliográficas.
