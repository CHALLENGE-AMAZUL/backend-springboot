info:
  name: Lista todos os artigos com paginação
  type: http
  seq: 5
  tags:
    - Artigo

http:
  method: GET
  url: "{{baseUrl}}/api/artigos"
  params:
    - name: pagina
      value: "0"
      type: query
    - name: tamanho
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Página de artigos retornada com sucesso
    request:
      url: "{{baseUrl}}/api/artigos"
      method: GET
      params:
        - name: pagina
          value: "0"
          type: query
        - name: tamanho
          value: "10"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "conteudo": [
              {}
            ],
            "pagina": 0,
            "tamanho": 10,
            "totalElementos": 42,
            "totalPaginas": 5,
            "ultimo": false
          }
  - name: 400 Response
    description: Parâmetros de paginação inválidos
    request:
      url: "{{baseUrl}}/api/artigos"
      method: GET
      params:
        - name: pagina
          value: "0"
          type: query
        - name: tamanho
          value: "10"
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "mensagem": "Artigo de id (999) não encontrado!",
            "erro": "Not Found",
            "status": 404,
            "timestamp": "2026-10-21T01:30:00"
          }
  - name: 500 Response
    description: Erro interno no servidor
    request:
      url: "{{baseUrl}}/api/artigos"
      method: GET
      params:
        - name: pagina
          value: "0"
          type: query
        - name: tamanho
          value: "10"
          type: query
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "mensagem": "Artigo de id (999) não encontrado!",
            "erro": "Not Found",
            "status": 404,
            "timestamp": "2026-10-21T01:30:00"
          }

docs: Recupera uma página de artigos cadastrados no acervo educativo da AMAZUL, incluindo dados do local e referências bibliográficas.
