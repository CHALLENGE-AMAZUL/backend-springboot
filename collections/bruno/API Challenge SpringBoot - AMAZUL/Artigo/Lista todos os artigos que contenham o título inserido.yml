info:
  name: Lista todos os artigos que contenham o título inserido
  type: http
  seq: 7
  tags:
    - Artigo

http:
  method: GET
  url: "{{baseUrl}}/api/artigos/busca"
  params:
    - name: titulo
      value: ""
      type: query
    - name: pagina
      value: "0"
      type: query
    - name: tamanho
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Artigos contendo o texto inserido listados
    request:
      url: "{{baseUrl}}/api/artigos/busca"
      method: GET
      params:
        - name: titulo
          value: ""
          type: query
        - name: pagina
          value: "0"
          type: query
        - name: tamanho
          value: "10"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "conteudo": [
              {}
            ],
            "pagina": 0,
            "tamanho": 10,
            "totalElementos": 42,
            "totalPaginas": 5,
            "ultimo": false
          }
