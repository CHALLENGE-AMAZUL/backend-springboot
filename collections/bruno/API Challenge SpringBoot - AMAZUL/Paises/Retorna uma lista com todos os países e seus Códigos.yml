info:
  name: Retorna uma lista com todos os países e seus Códigos
  type: http
  seq: 1
  tags:
    - Paises

http:
  method: GET
  url: "{{baseUrl}}/api/paises"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Lista de países formatada retornada com sucesso
    request:
      url: "{{baseUrl}}/api/paises"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          [
            "AF - Afghanistan",
            "AL - Albania",
            "BR - Brazil",
            "CA - Canada",
            "FR - France",
            "JP - Japan",
            "US - United States"
          ]
  - name: 500 Response
    description: Erro ao comunicar-se com a API externa de geolocalização
    request:
      url: "{{baseUrl}}/api/paises"
      method: GET
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "mensagem": "Erro interno inesperado.",
            "erro": "Internal Server Error",
            "status": 500,
            "timestamp": "2026-10-26T22:00:00"
          }

docs: Consulta o catálogo internacional da API Country State City e retorna lista de países formatados no padrão 'ISO2 - Nome'.
