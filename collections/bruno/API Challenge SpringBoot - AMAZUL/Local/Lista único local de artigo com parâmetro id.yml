info:
  name: Lista único local de artigo com parâmetro id
  type: http
  seq: 2
  tags:
    - Local

http:
  method: GET
  url: "{{baseUrl}}/api/locais/:id"
  params:
    - name: id
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Local recuperado com sucesso
    request:
      url: "{{baseUrl}}/api/locais/:id"
      method: GET
      params:
        - name: id
          value: "1"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "id": 1,
            "nome": "Complexo radiológico de Iperó/Aramar (CTMSP)",
            "nomePais": "Brazil",
            "codigoPais": "BR",
            "latitude": "-10.00000000",
            "longitude": "-55.00000000"
          }
  - name: 404 Response
    description: Local não encontrado para o ID informado
    request:
      url: "{{baseUrl}}/api/locais/:id"
      method: GET
      params:
        - name: id
          value: "999"
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "mensagem": "Local de id (999) não encontrado!",
            "erro": "Not Found",
            "status": 404,
            "timestamp": "2026-10-26T22:00:00"
          }

docs: Recupera os detalhes geográficos e institucionais de um local específico através de seu ID.
