info:
  name: Lista único local de artigo com parâmetro id
  type: http
  seq: 1
  tags:
    - Local

http:
  method: GET
  url: "{{baseUrl}}/api/locais/:id"
  params:
    - name: id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/locais/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "nome": "",
            "cidade": "",
            "nomePais": "",
            "codigoPais": "",
            "latitude": "",
            "longitude": ""
          }
