info:
  name: Atualizar local existente
  type: http
  seq: 4
  tags:
    - Local

http:
  method: PUT
  url: "{{baseUrl}}/api/locais/:id"
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "nome": "Complexo radiológico de Iperó/Aramar (CTMSP - Atualizado)",
        "codigoPais": "BR"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Local atualizado com sucesso
    request:
      url: "{{baseUrl}}/api/locais/:id"
      method: PUT
      params:
        - name: id
          value: "1"
          type: path
      body:
        type: json
        data: |-
          {
            "nome": "Complexo radiológico de Iperó/Aramar (CTMSP - Atualizado)",
            "codigoPais": "BR"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "id": 1,
            "nome": "Complexo radiológico de Iperó/Aramar (CTMSP - Atualizado)",
            "nomePais": "Brazil",
            "codigoPais": "BR",
            "latitude": "-10.00000000",
            "longitude": "-55.00000000"
          }
  - name: 404 Response
    description: Local não encontrado para o ID informado
    request:
      url: "{{baseUrl}}/api/locais/:id"
      method: PUT
      params:
        - name: id
          value: "999"
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "mensagem": "Local de id (999) não encontrado!",
            "erro": "Not Found",
            "status": 404,
            "timestamp": "2026-10-26T22:00:00"
          }

docs: Atualiza o nome e/ou o código de país de um local existente, atualizando coordenadas geográficas associadas.
