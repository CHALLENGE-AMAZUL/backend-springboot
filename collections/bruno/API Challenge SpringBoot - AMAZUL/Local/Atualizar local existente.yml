info:
  name: Atualizar local existente
  type: http
  seq: 2
  tags:
    - Local

http:
  method: PUT
  url: "{{baseUrl}}/api/locais/:id"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "nome": "Complexo radiológico de Iperó/Aramar (CTMSP)",
        "codigoPais": "BR"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
