info:
  name: Deletar local existente
  type: http
  seq: 5
  tags:
    - Local

http:
  method: DELETE
  url: "{{baseUrl}}/api/locais/:id"
  params:
    - name: id
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 204 Response
    description: Local excluído com sucesso
    request:
      url: "{{baseUrl}}/api/locais/:id"
      method: DELETE
      params:
        - name: id
          value: "1"
          type: path
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Local não encontrado para o ID informado
    request:
      url: "{{baseUrl}}/api/locais/:id"
      method: DELETE
      params:
        - name: id
          value: "999"
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "mensagem": "Local de id (999) não encontrado!",
            "erro": "Not Found",
            "status": 404,
            "timestamp": "2026-10-26T22:00:00"
          }

docs: Remove definitivamente um ponto geográfico ou instalação da base de dados.
