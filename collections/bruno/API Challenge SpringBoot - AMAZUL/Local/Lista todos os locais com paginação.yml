info:
  name: Lista todos os locais com paginação
  type: http
  seq: 1
  tags:
    - Local

http:
  method: GET
  url: "{{baseUrl}}/api/locais"
  params:
    - name: pagina
      value: "0"
      type: query
    - name: tamanho
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Página de locais retornada com sucesso
    request:
      url: "{{baseUrl}}/api/locais"
      method: GET
      params:
        - name: pagina
          value: "0"
          type: query
        - name: tamanho
          value: "10"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "conteudo": [
              {
                "id": 1,
                "nome": "Complexo radiológico de Iperó/Aramar (CTMSP)",
                "cidade": null,
                "nomePais": "Brazil",
                "codigoPais": "BR",
                "latitude": "-10.00000000",
                "longitude": "-55.00000000"
              }
            ],
            "pagina": 0,
            "tamanho": 10,
            "totalElementos": 1,
            "totalPaginas": 1,
            "ultimo": true
          }

docs: Retorna uma lista paginada de instalações e locais relacionados à tecnologia nuclear com suas coordenadas.
