info:
  name: Atualizar fonte de artigo existente
  type: http
  seq: 2
  tags:
    - Fonte

http:
  method: PUT
  url: "{{baseUrl}}/api/fontes/:id"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "titulo": "Programa Nuclear da Marinha - CTMSP",
        "url": "https://www.marinha.mil.br/ctmsp/programa-nuclear"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/fontes/:id"
      method: PUT
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "titulo": "Programa Nuclear da Marinha - CTMSP",
            "url": "https://www.marinha.mil.br/ctmsp/programa-nuclear"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "titulo": "",
            "url": "",
            "artigos": [],
            "atualizadoEm": ""
          }
