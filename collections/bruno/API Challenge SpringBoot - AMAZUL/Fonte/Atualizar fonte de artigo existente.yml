info:
  name: Atualizar fonte de artigo existente
  type: http
  seq: 4
  tags:
    - Fonte

http:
  method: PUT
  url: "{{baseUrl}}/api/fontes/:id"
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "titulo": "Programa Nuclear da Marinha - CTMSP (Atualizado)",
        "url": "https://www.marinha.mil.br/ctmsp/programa-nuclear"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Fonte atualizada com sucesso
    request:
      url: "{{baseUrl}}/api/fontes/:id"
      method: PUT
      params:
        - name: id
          value: "1"
          type: path
      body:
        type: json
        data: |-
          {
            "titulo": "Programa Nuclear da Marinha - CTMSP (Atualizado)",
            "url": "https://www.marinha.mil.br/ctmsp/programa-nuclear"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "id": 1,
            "titulo": "Programa Nuclear da Marinha - CTMSP (Atualizado)",
            "url": "https://www.marinha.mil.br/ctmsp/programa-nuclear",
            "artigos": [
              "Produção de Radiofármacos para Diagnóstico e Tratamento Oncológico"
            ],
            "atualizadoEm": "2026-10-26T22:00:00.000Z"
          }
  - name: 404 Response
    description: Fonte não encontrada para o ID informado
    request:
      url: "{{baseUrl}}/api/fontes/:id"
      method: PUT
      params:
        - name: id
          value: "999"
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "mensagem": "Fonte de id (999) não encontrado!",
            "erro": "Not Found",
            "status": 404,
            "timestamp": "2026-10-26T22:00:00"
          }

docs: Atualiza os dados de título e URL de uma referência científica existente.
