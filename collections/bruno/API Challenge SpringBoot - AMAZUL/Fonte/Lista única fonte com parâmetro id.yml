info:
  name: Lista única fonte com parâmetro id
  type: http
  seq: 2
  tags:
    - Fonte

http:
  method: GET
  url: "{{baseUrl}}/api/fontes/:id"
  params:
    - name: id
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Fonte científica recuperada com sucesso
    request:
      url: "{{baseUrl}}/api/fontes/:id"
      method: GET
      params:
        - name: id
          value: "1"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "id": 1,
            "titulo": "Programa Nuclear da Marinha - CTMSP",
            "url": "https://www.marinha.mil.br/ctmsp/programa-nuclear",
            "artigos": [
              "Produção de Radiofármacos para Diagnóstico e Tratamento Oncológico"
            ],
            "atualizadoEm": "2026-10-26T22:00:00.000Z"
          }
  - name: 404 Response
    description: Fonte não encontrada para o ID informado
    request:
      url: "{{baseUrl}}/api/fontes/:id"
      method: GET
      params:
        - name: id
          value: "999"
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "mensagem": "Fonte de id (999) não encontrado!",
            "erro": "Not Found",
            "status": 404,
            "timestamp": "2026-10-26T22:00:00"
          }

docs: Recupera uma fonte bibliográfica e científica específica a partir de seu ID.
