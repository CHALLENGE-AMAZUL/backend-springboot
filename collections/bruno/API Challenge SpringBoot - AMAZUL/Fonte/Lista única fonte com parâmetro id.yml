info:
  name: Lista única fonte com parâmetro id
  type: http
  seq: 1
  tags:
    - Fonte

http:
  method: GET
  url: "{{baseUrl}}/api/fontes/:id"
  params:
    - name: id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
