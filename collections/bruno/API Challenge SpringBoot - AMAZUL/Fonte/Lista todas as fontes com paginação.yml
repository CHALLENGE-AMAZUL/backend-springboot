info:
  name: Lista todas as fontes com paginação
  type: http
  seq: 1
  tags:
    - Fonte

http:
  method: GET
  url: "{{baseUrl}}/api/fontes"
  params:
    - name: pagina
      value: "0"
      type: query
    - name: tamanho
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Página de fontes recuperada com sucesso
    request:
      url: "{{baseUrl}}/api/fontes"
      method: GET
      params:
        - name: pagina
          value: "0"
          type: query
        - name: tamanho
          value: "10"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "conteudo": [
              {
                "id": 1,
                "titulo": "Programa Nuclear da Marinha - CTMSP",
                "url": "https://www.marinha.mil.br/ctmsp/programa-nuclear",
                "artigos": [
                  "Produção de Radiofármacos para Diagnóstico e Tratamento Oncológico"
                ],
                "atualizadoEm": "2026-10-26T22:00:00.000Z"
              }
            ],
            "pagina": 0,
            "tamanho": 10,
            "totalElementos": 1,
            "totalPaginas": 1,
            "ultimo": true
          }
  - name: 400 Response
    description: Parâmetros de paginação inválidos
    request:
      url: "{{baseUrl}}/api/fontes"
      method: GET
      params:
        - name: pagina
          value: "invalido"
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "mensagem": "Parâmetro: (pagina) inválido!",
            "erro": "Bad Request",
            "status": 400,
            "timestamp": "2026-10-26T22:00:00"
          }

docs: Retorna uma página de fontes de referência cadastradas, indicando os títulos dos artigos vinculados a cada uma.
