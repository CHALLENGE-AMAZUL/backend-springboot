info:
  name: Criação de fonte de artigo
  type: http
  seq: 3
  tags:
    - Fonte

http:
  method: POST
  url: "{{baseUrl}}/api/fontes"
  body:
    type: json
    data: |-
      {
        "titulo": "Programa Nuclear da Marinha - CTMSP",
        "url": "https://www.marinha.mil.br/ctmsp/programa-nuclear"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Fonte criada com sucesso
    request:
      url: "{{baseUrl}}/api/fontes"
      method: POST
      body:
        type: json
        data: |-
          {
            "titulo": "Programa Nuclear da Marinha - CTMSP",
            "url": "https://www.marinha.mil.br/ctmsp/programa-nuclear"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
        - name: Location
          value: /api/fontes/1
      body:
        type: text
        data: |-
          {
            "id": 1,
            "titulo": "Programa Nuclear da Marinha - CTMSP",
            "url": "https://www.marinha.mil.br/ctmsp/programa-nuclear",
            "artigos": [],
            "atualizadoEm": "2026-10-26T22:00:00.000Z"
          }
  - name: 400 Response
    description: Erro de validação da fonte
    request:
      url: "{{baseUrl}}/api/fontes"
      method: POST
      body:
        type: json
        data: |-
          {
            "titulo": "",
            "url": "url-invalida"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: text
        data: |-
          {
            "erro": "Bad Request",
            "status": 400,
            "campos": [
              {
                "campo": "titulo",
                "mensagem": "Título deve ser inserido!"
              },
              {
                "campo": "url",
                "mensagem": "A URL informada deve possuir um formato válido!"
              }
            ],
            "timestamp": "2026-10-26T22:00:00"
          }

docs: Registra uma nova fonte de informação primária ou referência científica oficial no acervo.
