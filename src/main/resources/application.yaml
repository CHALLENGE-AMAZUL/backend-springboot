spring:
  application:
    name: api-springboot
  datasource:
    url: jdbc:h2:mem:challenge-amazul
    driver-class-name: org.h2.Driver
    username: sfc
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    mapper:
      accept-case-insensitive-enums: true
api:
  country:
    base-url: ${API_COUNTRY_BASE_URL:https://api.countrystatecity.in/v1}
    key: ${API_COUNTRY_KEY:}
